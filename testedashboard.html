<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball F1 - Equipe 8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --bg-dark: #121212; --panel-bg: #1e1e1e; --primary-red: #e10600; --text-light: #f5f5f5; --text-muted: #aaaaaa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background-color: var(--primary-red); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        header h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        .dashboard-container, .table-container { width: 90%; max-width: 1200px; margin-top: 20px; box-sizing: border-box; }
        .dashboard-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background-color: var(--panel-bg); padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary-red); opacity: 0; }
        .card h3 { margin-top: 0; color: var(--text-muted); font-size: 0.9rem; }
        .card .value { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        .card .desc { font-size: 0.8rem; color: var(--primary-red); }
        .table-container { background-color: var(--panel-bg); padding: 20px; border-radius: 8px; opacity: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>Moneyball F1</h1>
        <button onclick="alert('Fazer requisição para api_logout.php')" style="background: #fff; color: red; border: none; padding: 8px; cursor: pointer;">Sair</button>
    </header>

    <div class="table-container">
        <h2>Importar Dados (CSV)</h2>
        <input type="file" id="arquivoCsv" accept=".csv" style="margin-bottom: 15px;">
        <button onclick="importarCSV()" style="background: var(--primary-red); color: white; border: none; padding: 8px 15px; cursor: pointer;">Enviar Planilha</button>
        <div id="status-upload" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div class="dashboard-container" id="cards-container">
        <div class="card">
            <h3>Q1. Melhor Desempenho</h3>
            <div class="value" id="melhor-piloto">--</div>
        </div>
        <div class="card">
            <h3>Q2. Pior Desempenho</h3>
            <div class="value" id="pior-piloto">--</div>
        </div>
        <div class="card">
            <h3>Q4. Maior Regularidade</h3>
            <div class="value" id="regular-piloto">--</div>
        </div>
        <div class="card">
            <h3>Q7. Mais Rápido (Corrida)</h3>
            <div class="value" id="rapido-piloto">--</div>
        </div>
    </div>

    <div class="table-container" id="ranking-container">
        <h2>Ranking Top 5 (Q3)</h2>
        <table>
            <thead><tr><th>Posição</th><th>Piloto</th><th>Pontos</th></tr></thead>
            <tbody id="tabela-top5"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.to(".card, .table-container", { y: -10, opacity: 1, duration: 0.5, stagger: 0.1 });
            carregarDadosDoBackend();
        });

        async function importarCSV() {
            const fileInput = document.getElementById('arquivoCsv');
            const statusDiv = document.getElementById('status-upload');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Selecione um arquivo.";
                return;
            }

            const formData = new FormData();
            formData.append("arquivo", fileInput.files[0]);
            statusDiv.innerText = "Processando...";

            try {
                const response = await fetch('/api_importar.php', { method: 'POST', body: formData });
                if (response.ok) {
                    statusDiv.innerText = "✅ Sucesso!";
                    carregarDadosDoBackend(); 
                } else {
                    statusDiv.innerText = "❌ Erro na importação.";
                }
            } catch (erro) {
                statusDiv.innerText = "❌ Erro de conexão.";
            }
        }

        async function carregarDadosDoBackend() {
            try {
                const response = await fetch('/api_perguntas.php');
                const dados = await response.json();

                if(dados) {
                    document.getElementById('melhor-piloto').innerText = dados.melhor_desempenho?.nome || '--';
                    document.getElementById('pior-piloto').innerText = dados.pior_desempenho?.nome || '--';
                    document.getElementById('regular-piloto').innerText = dados.maior_regularidade?.nome || '--';
                    document.getElementById('rapido-piloto').innerText = dados.mais_rapido?.nome || '--';

                    const tbody = document.getElementById('tabela-top5');
                    tbody.innerHTML = '';
                    if(dados.top_5) {
                        dados.top_5.forEach((piloto, index) => {
                            tbody.innerHTML += `<tr><td>#${index + 1}</td><td>${piloto.nome}</td><td>${piloto.pontos}</td></tr>`;
                        });
                    }
                }
            } catch (error) {
                console.error("Sem dados da API ainda ou erro de conexão.");
            }
        }
    </script>
</body>
</html>
