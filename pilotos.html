<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PITWALL | Driver Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600&family=Rajdhani:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-base: #0A0A0C; --bg-surface: #121215; --bg-surface-hover: #18181D; --border-color: #222228; --text-main: #EFEFEF; --text-muted: #888892; --accent-red: #FF1801; --neon-teal: #27F4D2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        .font-data { font-family: 'Fira Code', monospace; }
        .font-header { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; font-style: italic; }
        .sidebar { width: 250px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; flex-shrink: 0; }
        .sidebar-brand { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .sidebar-brand h2 { font-size: 1.6rem; color: var(--text-main); }
        .sidebar-brand h2 span { color: var(--accent-red); }
        .nav-menu { flex: 1; padding: 1rem 0; list-style: none; overflow-y: auto; }
        .nav-item a { display: flex; align-items: center; gap: 12px; padding: 0.8rem 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; border-left: 2px solid transparent; transition: all 0.2s; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.03); color: var(--text-main); }
        .nav-item.active a { border-left-color: var(--accent-red); background-color: rgba(255, 24, 1, 0.05); }
        .nav-item i { width: 20px; font-size: 1rem; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background-image: linear-gradient(rgba(34, 34, 40, 0.25) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 34, 40, 0.25) 1px, transparent 1px); background-size: 50px 50px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
        .dashboard-container { padding: 2rem; max-width: 1600px; margin: 0 auto; width: 100%; }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-flag-checkered" style="color: var(--accent-red);"></i><h2 class="font-header">PIT<span>WALL</span></h2></div>
        <ul class="nav-menu font-data">
            <li class="nav-item"><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item active"><a href="pilotos.html"><i class="fas fa-id-card"></i> Drivers</a></li>
            <li class="nav-item"><a href="comparar.html"><i class="fas fa-code-compare"></i> Head-to-Head</a></li>
            <li class="nav-item"><a href="corridas.html"><i class="fas fa-road"></i> Race Calendar</a></li>
            <li class="nav-item"><a href="perguntas.html"><i class="fas fa-brain"></i> Analytics</a></li>
            <li class="nav-item"><a href="database.html"><i class="fas fa-database"></i> Data Center</a></li>
            <li class="nav-item"><a href="#" id="btn-logout"><i class="fas fa-power-off"></i> Exit System</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:15px; width: 400px;">
                <select id="season-selector" style="background:var(--bg-surface); color:var(--neon-teal); border:none; border-bottom:2px solid var(--border-color); outline:none; font-family:'Fira Code'; font-size:1rem; cursor:pointer; padding:10px;">
                    <option value="">ALL-TIME</option>
                </select>
                <div style="position: relative; flex:1;">
                    <i class="fas fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
                    <input type="text" id="search-input" placeholder="SEARCH ROSTER..." style="width:100%; background:var(--bg-surface); border:1px solid var(--border-color); color:#FFF; padding:10px 10px 10px 35px; font-family:'Fira Code'; outline:none; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
                </div>
            </div>
            <div><span style="font-size: 0.65rem; color: #888; text-transform: uppercase;">Total Drivers</span><div class="font-data" style="font-size: 0.95rem; font-weight: 600;" id="total-drivers-count">0</div></div>
        </header>
        
        <div class="dashboard-container">
            <div class="section-header"><h3 class="font-header" style="font-size: 1.6rem;">Active Driver Roster</h3></div>
            <div class="driver-grid" id="driver-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1.5rem;">
                <div id="empty-state" style="grid-column: 1/-1; text-align:center; padding:4rem; color:var(--text-muted); font-family:'Fira Code';"><i class="fas fa-circle-notch fa-spin"></i> SYNCING...</div>
            </div>
        </div>
    </main>

    <script>
        let allDrivers = [];

        function getTeamStyle(teamName) {
            const team = teamName.toLowerCase();
            if (team.includes('red bull')) return '#3671C6';
            if (team.includes('ferrari')) return '#E80020';
            if (team.includes('mclaren')) return '#FF8700';
            if (team.includes('mercedes')) return '#27F4D2';
            if (team.includes('aston martin')) return '#229971';
            if (team.includes('williams')) return '#00A0DE';
            return '#888892';
        }

        async function fetchSeasons() {
            const res = await fetch('api_temporadas.php');
            const data = await res.json();
            const sel = document.getElementById('season-selector');
            if(data.dados) data.dados.forEach(a => sel.innerHTML += `<option value="${a}">${a} SEASON</option>`);
        }

        async function fetchDrivers(ano = '') {
            try {
                const res = await fetch(`api_pilotos.php?ano=${ano}`);
                const data = await res.json();
                allDrivers = data.dados || [];
                document.getElementById('total-drivers-count').innerText = allDrivers.length;
                renderDrivers(allDrivers);
            } catch(e) { document.getElementById('empty-state').innerHTML = "DATABASE EMPTY OR ERROR"; }
        }

        function renderDrivers(drivers) {
            const grid = document.getElementById('driver-grid');
            grid.innerHTML = '';
            if (drivers.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:4rem; color:#888; font-family:\'Fira Code\'">NO DRIVERS FOUND IN MATRIX</div>'; return; }
            
            drivers.forEach(driver => {
                const color = getTeamStyle(driver.equipe || '');
                grid.innerHTML += `
                    <div style="background:var(--bg-surface); border:1px solid var(--border-color); border-top: 3px solid ${color}; display:flex; flex-direction:column; clip-path:polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);">
                        <div style="padding:1.5rem; border-bottom:1px solid var(--border-color);">
                            <div class="font-header" style="font-size:1.5rem; font-weight:700;">${driver.nome}</div>
                            <div style="font-size:0.75rem; color:#888; text-transform:uppercase;">${driver.equipe || 'N/A'}</div>
                        </div>
                        <div style="padding:1.5rem; display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
                            <div style="display:flex; flex-direction:column;"><span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Points</span><span class="font-data" style="color:var(--neon-teal); font-size:1.2rem; font-weight:600;">${driver.pontos}</span></div>
                            <div style="display:flex; flex-direction:column;"><span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Wins</span><span class="font-data" style="font-size:1.2rem; font-weight:600;">${driver.vitorias}</span></div>
                            <div style="display:flex; flex-direction:column;"><span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Overtakes</span><span class="font-data" style="font-size:1.2rem; font-weight:600;">+${driver.posicoes_ganhas || 0}</span></div>
                            <div style="display:flex; flex-direction:column;"><span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Poles</span><span class="font-data" style="font-size:1.2rem; font-weight:600;">${driver.poles}</span></div>
                        </div>
                        <div style="padding: 1rem 1.5rem; background-color: var(--bg-surface-hover); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                            <span class="font-data" style="color: var(--text-muted); font-size: 0.7rem;">STATUS: ACTIVE</span>
                            <button style="background:transparent; border:none; color:var(--accent-red); font-family:'Fira Code'; font-size:0.75rem; cursor:pointer; text-transform:uppercase;" onclick="window.location.href='comparar.html?driver1=${driver.id}'">Compare <i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('season-selector').addEventListener('change', (e) => fetchDrivers(e.target.value));
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderDrivers(allDrivers.filter(d => (d.nome || '').toLowerCase().includes(term) || (d.equipe || '').toLowerCase().includes(term)));
        });

        document.getElementById('btn-logout').addEventListener('click', async (e) => { e.preventDefault(); await fetch('api_logout.php', { method: 'POST' }); window.location.href = 'login.html'; });
        document.addEventListener('DOMContentLoaded', async () => { await fetchSeasons(); fetchDrivers(); });
    </script>
</body>
</html>
