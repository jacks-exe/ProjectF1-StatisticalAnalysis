<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PITWALL | Moneyball Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600&family=Rajdhani:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-base: #0A0A0C; --bg-surface: #121215; --bg-surface-hover: #18181D; --border-color: #222228; --text-main: #EFEFEF; --text-muted: #888892; --accent-red: #FF1801; --neon-teal: #27F4D2; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        .font-data { font-family: 'Fira Code', monospace; }
        .font-header { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; font-style: italic; }
        .sidebar { width: 250px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; flex-shrink: 0; }
        .sidebar-brand { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .sidebar-brand h2 { font-size: 1.6rem; color: var(--text-main); }
        .sidebar-brand h2 span { color: var(--accent-red); }
        .nav-menu { flex: 1; padding: 1rem 0; list-style: none; overflow-y: auto; }
        .nav-item a { display: flex; align-items: center; gap: 12px; padding: 0.8rem 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; border-left: 2px solid transparent; transition: all 0.2s; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.03); color: var(--text-main); }
        .nav-item.active a { border-left-color: var(--accent-red); background-color: rgba(255, 24, 1, 0.05); }
        .nav-item i { width: 20px; font-size: 1rem; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background-image: linear-gradient(rgba(34, 34, 40, 0.25) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 34, 40, 0.25) 1px, transparent 1px); background-size: 50px 50px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
        .dashboard-container { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-flag-checkered" style="color: var(--accent-red);"></i><h2 class="font-header">PIT<span>WALL</span></h2></div>
        <ul class="nav-menu font-data">
            <li class="nav-item"><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a href="pilotos.html"><i class="fas fa-id-card"></i> Drivers</a></li>
            <li class="nav-item"><a href="comparar.html"><i class="fas fa-code-compare"></i> Head-to-Head</a></li>
            <li class="nav-item"><a href="corridas.html"><i class="fas fa-road"></i> Race Calendar</a></li>
            <li class="nav-item active"><a href="perguntas.html"><i class="fas fa-brain"></i> Analytics</a></li>
            <li class="nav-item"><a href="database.html"><i class="fas fa-database"></i> Data Center</a></li>
            <li class="nav-item"><a href="#" id="btn-logout"><i class="fas fa-power-off"></i> Exit System</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div><span style="font-size:0.65rem; color:#888; text-transform:uppercase;">Analytics Node</span><div class="font-data" style="font-size:0.95rem; font-weight:600;">ALGORITHM PROCESSING</div></div>
            <select id="season-selector" style="background:transparent; color:var(--neon-teal); border:none; border-bottom:1px solid var(--border-color); outline:none; font-family:'Fira Code'; font-size:1rem; cursor:pointer;"><option value="">All-Time / Core</option></select>
        </header>
        <div class="dashboard-container">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:2rem; border-bottom:1px solid #222228; padding-bottom:0.5rem;"><h3 class="font-header" style="font-size:1.6rem;">Moneyball Scouting Intelligence</h3></div>
            <div class="analytics-grid" id="analytics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 1.5rem;"></div>
        </div>
    </main>

    <script>
        async function fetchSeasons() {
            const res = await fetch('api_temporadas.php');
            const data = await res.json();
            const sel = document.getElementById('season-selector');
            if(data.dados) data.dados.forEach(a => sel.innerHTML += `<option value="${a}">${a}</option>`);
        }

        async function runMoneyballEngine(ano = '') {
            const grid = document.getElementById('analytics-grid');
            grid.innerHTML = '<div style="color:#888; font-family:\'Fira Code\'">PROCESSING NEURAL NETWORKS...</div>';
            
            try {
                const response = await fetch(`api_perguntas.php?ano=${ano}`);
                const perguntas = await response.json();
                grid.innerHTML = '';

                perguntas.forEach((pData, index) => {
                    const i = index + 1;
                    // Incidentes e Resilience são métricas diferentes, pinta de vermelho os abandonos
                    const borderColor = (i === 5) ? 'var(--accent-red)' : 'var(--neon-teal)';
                    
                    let tableRows = '';
                    if(pData.resultado && pData.resultado.length > 0) {
                        pData.resultado.forEach(row => {
                            tableRows += `<tr><td style="padding:0.5rem 0; border-bottom:1px dashed #222228; font-size:0.85rem;">${row.nome} <span style="color:#888; font-size:0.7rem;">(${row.equipe})</span></td><td style="padding:0.5rem 0; border-bottom:1px dashed #222228; color:var(--neon-teal); font-weight:600; text-align:right; font-family:'Fira Code';">${row.valor}${i===7?'%':''}</td></tr>`;
                        });
                    } else {
                        tableRows = `<tr><td colspan="2" style="color:#888; font-style:italic;">Insufficient telemetry data.</td></tr>`;
                    }

                    grid.innerHTML += `
                        <div style="background:rgba(18, 18, 21, 0.8); border:1px solid #222228; border-left:3px solid ${borderColor}; padding:1.5rem; display:flex; flex-direction:column; gap:1rem;">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="font-data" style="background:rgba(255,255,255,0.05); padding:4px 8px; font-size:0.7rem; color:#888;">MOD_${i.toString().padStart(2, '0')}</span>
                                <span class="font-header" style="font-size:1.2rem; font-weight:700;">${pData.pergunta}</span>
                            </div>
                            <table style="width:100%; border-collapse:collapse; margin-top:0.5rem;">
                                <thead><tr><th class="font-data" style="color:#888; font-weight: normal; font-size:0.7rem; text-align:left; padding-bottom:0.5rem;">DRIVER / TEAM</th><th class="font-data" style="color:#888; font-weight: normal; font-size:0.7rem; text-align:right; padding-bottom:0.5rem;">METRIC VALUE</th></tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>`;
                });
            } catch (error) { grid.innerHTML = '<div style="color:var(--accent-red); font-family:\'Fira Code\'">SYSTEM FAILURE / AWAITING CSV UPLOAD</div>'; }
        }

        document.getElementById('season-selector').addEventListener('change', (e) => runMoneyballEngine(e.target.value));
        document.getElementById('btn-logout').addEventListener('click', async (e) => { e.preventDefault(); await fetch('api_logout.php', { method: 'POST' }); window.location.href = 'login.html'; });
        document.addEventListener('DOMContentLoaded', async () => { await fetchSeasons(); runMoneyballEngine(); });
    </script>
</body>
</html>
